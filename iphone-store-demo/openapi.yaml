openapi: 3.0.3
info:
  title: iPhone Store Demo API
  version: 1.0.0
  description: |
    OpenAPI description of every HTTP endpoint exposed by the Next.js application.

    Conventions:
    - Request bodies for customer-facing endpoints use camelCase.
    - Database/API responses use snake_case.
    - Error responses are `{ "error": "message" }` unless stated otherwise.
    - `POST /api/checkout` and `GET /api/orders` are rate limited
      (default: 10 requests / 60 seconds / IP). Configure with
      `RATE_LIMIT_MAX` and `RATE_LIMIT_WINDOW_MS`.
    - Endpoints under `/api/test/*` return HTTP 404 unless
      `ENABLE_TEST_API=true` or `NODE_ENV=test`.
    - `/api/payment/mock` and the `/checkout/mock-payment` page return 404
      unless `PAYMENT_MODE=mock`.

    Order status lifecycle:
    `pending -> paid -> processing -> shipping -> completed`,
    `pending -> cancelled`, `paid -> failed` (delivery failed).
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://your-deployment.example.com
    description: Deployed environment (replace with the real URL)
tags:
  - name: Catalog
  - name: Checkout
  - name: Orders
  - name: Payments
  - name: Reviews
  - name: Tracking
  - name: Admin
  - name: Reporting
  - name: Test Utilities
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token. Obtain one from POST /api/test/auth-token.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Error message
        details:
          type: string
          nullable: true
    RateLimitError:
      type: object
      required: [error, retryAfter]
      properties:
        error:
          type: string
          example: Too many requests. Please try again later.
        retryAfter:
          type: integer
          example: 42
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        name_en: { type: string, nullable: true }
        slug: { type: string }
        description: { type: string, nullable: true }
        description_en: { type: string, nullable: true }
        price: { type: number, example: 14990000 }
        sale_price: { type: number, nullable: true, example: 14490000 }
        stock: { type: integer, example: 27 }
        sku: { type: string, example: IPHONE-001 }
        is_active: { type: boolean }
        image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid, nullable: true }
        product_name: { type: string }
        price: { type: number }
        quantity: { type: integer }
        subtotal: { type: number }
        image_url: { type: string, nullable: true }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        payment_link_id: { type: string, nullable: true }
        checkout_url: { type: string, nullable: true }
        amount: { type: number }
        status:
          type: string
          enum: [pending, paid, cancelled, failed]
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_code: { type: integer, format: int64, example: 9900000000001 }
        user_id: { type: string, format: uuid, nullable: true }
        customer_name: { type: string }
        customer_email: { type: string }
        customer_phone: { type: string }
        shipping_address: { type: string }
        total_amount: { type: number }
        status:
          type: string
          enum: [pending, paid, processing, shipping, completed, cancelled, failed]
        payment_method:
          type: string
          enum: [bank_transfer, cash]
        delivery_method:
          type: string
          enum: [shipping, pickup]
        collection_point_id: { type: string, format: uuid, nullable: true }
        language: { type: string, example: vi }
        payment_link_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CheckoutRequest:
      type: object
      required: [customerInfo, items, totalAmount]
      properties:
        customerInfo:
          type: object
          required: [fullName, email, phone]
          properties:
            fullName: { type: string, example: Nguyen Van A }
            email: { type: string, format: email, example: a@example.com }
            phone: { type: string, example: '0912345678' }
            address: { type: string, example: 123 Le Loi }
            city: { type: string, example: Quy Nhon }
            district: { type: string, example: Quy Nhon }
            ward: { type: string, example: Quy Nhon Nam }
            notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity, price]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              price: { type: number, minimum: 0 }
        totalAmount: { type: number, minimum: 0 }
        paymentMethod:
          type: string
          enum: [bank_transfer, cash]
          default: bank_transfer
        deliveryMethod:
          type: string
          enum: [shipping, pickup]
          default: shipping
        collectionPointId: { type: string, format: uuid, nullable: true }
        language:
          type: string
          enum: [vi, en]
          default: vi
        shippingFee:
          type: number
          minimum: 0
          default: 0
    CheckoutResponse:
      type: object
      required: [success, orderId, orderCode]
      properties:
        success: { type: boolean, example: true }
        orderId: { type: string, format: uuid }
        orderCode: { type: integer, format: int64 }
        paymentUrl:
          type: string
          nullable: true
          description: PayOS checkout URL in real mode, mock payment URL in mock mode, null for cash.
    OrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_code: { type: integer, format: int64 }
        total_amount: { type: number }
        status: { type: string }
        created_at: { type: string, format: date-time }
        order_items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        payments:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              paid_at: { type: string, format: date-time, nullable: true }
    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
    OrderDetailResponse:
      type: object
      properties:
        success: { type: boolean }
        order: { $ref: '#/components/schemas/Order' }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/OrderItem'
              - type: object
                properties:
                  product:
                    type: object
                    nullable: true
                    properties:
                      name: { type: string }
                      product_images:
                        type: array
                        items:
                          type: object
                          properties:
                            image_url: { type: string }
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        reviewer_name: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [product_id, reviewer_name, rating]
      properties:
        product_id: { type: string, format: uuid }
        reviewer_name: { type: string, maxLength: 100 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
    TrackOrderResponse:
      oneOf:
        - type: object
          properties:
            type: { type: string, enum: [require_phone] }
        - type: object
          properties:
            type: { type: string, enum: [single] }
            order: { $ref: '#/components/schemas/Order' }
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderItem' }
    EmailForwardingRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_email: { type: string, format: email }
        forward_to_email: { type: string, format: email }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuthTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3600 }
        expires_at: { type: integer, example: 1767225600 }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
        is_admin: { type: boolean }
    TestAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_admin: { type: boolean }
    SeedRequest:
      type: object
      properties:
        includeOrders: { type: boolean, default: true }
        reset: { type: boolean, default: true }
    SeedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        accounts:
          type: object
          properties:
            admin: { $ref: '#/components/schemas/TestAccount' }
            customer: { $ref: '#/components/schemas/TestAccount' }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              slug: { type: string, example: iphone-13 }
              name: { type: string, example: iPhone 13 }
        products:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              slug: { type: string, example: iphone-13 }
              name: { type: string, example: iPhone 13 }
              price: { type: number, example: 14990000 }
              sale_price: { type: number, nullable: true }
              stock: { type: integer, example: 27 }
        collectionPoint:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string }
        orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              order_code: { type: integer, format: int64 }
              status: { type: string }
              order_items: { type: integer }
    ResetResponse:
      type: object
      properties:
        success: { type: boolean }
        keepUsers: { type: boolean }
        deleted:
          type: object
          additionalProperties: { type: integer }
    CreateOrderRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paid, processing, shipping, completed, cancelled, failed]
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, default: 1 }
        customer:
          type: object
          properties:
            fullName: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            address: { type: string }
        paymentMethod:
          type: string
          enum: [bank_transfer, cash]
          default: bank_transfer
        deliveryMethod:
          type: string
          enum: [shipping, pickup]
          default: shipping
    MockPaymentRequest:
      type: object
      required: [result]
      properties:
        orderId: { type: string, format: uuid }
        orderCode: { type: integer, format: int64 }
        result:
          type: string
          enum: [success, failed]
      description: Provide either orderId or orderCode.
  headers:
    RateLimitLimit:
      schema: { type: integer }
      description: Maximum requests allowed in the current window.
    RateLimitRemaining:
      schema: { type: integer }
      description: Requests remaining in the current window.
    RateLimitReset:
      schema: { type: integer }
      description: Unix timestamp (seconds) when the window resets.
    RetryAfter:
      schema: { type: integer }
      description: Seconds to wait before retrying.
paths:
  /api/products:
    get:
      tags: [Catalog]
      summary: List active products
      operationId: listProducts
      responses:
        '200':
          description: Active products ordered by creation date (newest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '500':
          description: Failed to fetch products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/checkout:
    post:
      tags: [Checkout]
      summary: Create an order and initiate payment
      operationId: createCheckout
      description: |
        Creates an order and its items. For `bank_transfer`:
        - `PAYMENT_MODE=real` creates a PayOS payment link.
        - `PAYMENT_MODE=mock` returns a local mock payment URL.
        For `cash`, stock is decremented immediately and the order starts as `processing`.
        Rate limited by IP.
      responses:
        '200':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400':
          description: Missing fields, inactive product or insufficient stock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitError' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
  /api/orders:
    get:
      tags: [Orders]
      summary: List the authenticated user's orders
      operationId: listMyOrders
      security:
        - bearerAuth: []
      description: Requires a Supabase access token. Rate limited by IP.
      responses:
        '200':
          description: Orders belonging to the current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitError' }
        '500':
          description: Failed to load orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by UUID
      operationId: getOrderById
      description: Public endpoint; the unguessable UUID acts as an access token for guests.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order and its items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }
        '404':
          description: Order not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/orders/confirm-payment:
    post:
      tags: [Payments]
      summary: Confirm a PayOS payment after redirect
      operationId: confirmPayment
      description: Verifies the payment with PayOS and marks the order as paid. Idempotent for non-pending orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode]
              properties:
                orderCode: { type: integer, format: int64 }
      responses:
        '200':
          description: Payment confirmed or already processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          description: Missing orderCode or payment not completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/orders/cancel-expired-orders:
    get:
      tags: [Orders]
      summary: Cancel pending orders older than 3 days
      operationId: cancelExpiredOrders
      description: Intended for a cron job. Requires the `x-cron-secret` header matching `CRON_SECRET`.
      parameters:
        - name: x-cron-secret
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancellation summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  cancelled: { type: integer }
                  failed: { type: integer }
                  total: { type: integer }
                  message: { type: string }
        '401':
          description: Missing or invalid cron secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/payment/webhook:
    post:
      tags: [Payments]
      summary: PayOS webhook handler
      operationId: paymentWebhook
      description: Verifies the HMAC SHA-256 signature, logs the payload and updates order/payment status.
      parameters:
        - name: x-payos-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: '00' }
                desc: { type: string }
                success: { type: boolean }
                signature: { type: string }
                data:
                  type: object
                  properties:
                    orderCode: { type: integer, format: int64 }
                    amount: { type: number }
                    description: { type: string }
                    accountNumber: { type: string }
                    reference: { type: string }
                    transactionDateTime: { type: string }
                    currency: { type: string }
                    paymentLinkId: { type: string }
                    code: { type: string }
                    desc: { type: string }
      responses:
        '200':
          description: Processed or already processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          description: Missing orderCode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Webhook processing failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/payment/mock:
    post:
      tags: [Payments, Test Utilities]
      summary: Simulate a payment result (mock mode only)
      operationId: mockPayment
      description: Returns 404 unless `PAYMENT_MODE=mock`. Waits `MOCK_PAYMENT_DELAY_MS` before applying the result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockPaymentRequest' }
      responses:
        '200':
          description: Mock payment applied (or order already processed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orderId: { type: string, format: uuid }
                  orderCode: { type: integer, format: int64 }
                  status: { type: string, enum: [paid, failed] }
                  message: { type: string }
        '400':
          description: Invalid result or missing order reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Mock mode disabled or order not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Mock payment failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/track-order:
    get:
      tags: [Tracking]
      summary: Look up an order by code (and last 4 phone digits)
      operationId: trackOrder
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, example: '9900000000001' }
        - name: phone4
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 4, example: '0001' }
      responses:
        '200':
          description: 'Either `{ type: require_phone }` or the full order.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackOrderResponse' }
        '400':
          description: Missing code or wrong phone digits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/reviews:
    get:
      tags: [Reviews]
      summary: List product reviews
      operationId: listReviews
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reviews ordered by created_at descending (raw array).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '400':
          description: Missing product_id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Reviews]
      summary: Create a product review
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Created review (raw object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          description: Validation error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/track-visit:
    post:
      tags: [Reporting]
      summary: Increment the site visit counter
      operationId: trackVisit
      responses:
        '200':
          description: New total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
        '500':
          description: Failed to track visit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/admin/email-forwarding:
    get:
      tags: [Admin]
      summary: List email forwarding rules
      operationId: listEmailForwarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Forwarding rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EmailForwardingRule' }
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: User is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Admin]
      summary: Create an email forwarding rule
      operationId: createEmailForwarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceEmail, forwardToEmail]
              properties:
                sourceEmail: { type: string, format: email }
                forwardToEmail: { type: string, format: email }
      responses:
        '200':
          description: Rule created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          description: Missing fields or invalid email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: User is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Failed to create rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Admin]
      summary: Enable or disable a forwarding rule
      operationId: updateEmailForwarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, isActive]
              properties:
                id: { type: string, format: uuid }
                isActive: { type: boolean }
      responses:
        '200':
          description: Rule updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          description: Missing fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: User is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Failed to update rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Admin]
      summary: Delete a forwarding rule
      operationId: deleteEmailForwarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        '200':
          description: Rule deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          description: Missing id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: User is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Failed to delete rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/test/seed:
    post:
      tags: [Test Utilities]
      summary: Seed the iPhone catalog and test data
      operationId: seedTestData
      description: |
        Returns 404 unless `ENABLE_TEST_API=true` or `NODE_ENV=test`.
        By default the database is reset first, then the iPhone 13–18
        categories (24 products), two accounts, a pickup point and one
        order per status are created.
        Test accounts: admin@test.local / Admin123! and customer@test.local / Customer123!.
        Seeded order codes are 9900000000001..9900000000007; phone is 0900000001.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeedRequest' }
      responses:
        '200':
          description: Seeded data with generated IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeedResponse' }
        '404':
          description: Test API disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Seeding failed (see `details`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/test/reset:
    post:
      tags: [Test Utilities]
      summary: Wipe all business data
      operationId: resetTestData
      description: |
        Returns 404 unless `ENABLE_TEST_API=true` or `NODE_ENV=test`.
        Deletes all orders, payments, items, products, categories,
        collection points, reviews, forwarding rules and users.
        Pass `{ "keepUsers": true }` to preserve auth users.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keepUsers: { type: boolean, default: false }
      responses:
        '200':
          description: Deletion summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetResponse' }
        '404':
          description: Test API disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Reset failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/test/create-order:
    post:
      tags: [Test Utilities]
      summary: Create a test order with a specific status
      operationId: createTestOrder
      description: Returns 404 unless `ENABLE_TEST_API=true` or `NODE_ENV=test`. Does not decrement stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Created order and item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: '#/components/schemas/Order' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderItem' }
                  product:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      unitPrice: { type: number }
        '400':
          description: Invalid status/quantity or no product available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Test API disabled or product not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Creation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/test/auth-token:
    post:
      tags: [Test Utilities]
      summary: Exchange email/password for a Bearer token
      operationId: createAuthToken
      description: |
        Returns 404 unless `ENABLE_TEST_API=true` or `NODE_ENV=test`.
        Use the returned access_token in `Authorization: Bearer <token>` for
        JMeter and API tests. Tokens expire after `expires_in` seconds
        (Supabase default: 3600).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@test.local }
                password: { type: string, example: Admin123! }
      responses:
        '200':
          description: Session tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '400':
          description: Missing credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Invalid email/password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Test API disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Token creation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
